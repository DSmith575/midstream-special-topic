<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MidStream Assessment Form</title>
  <link href="{{url_for('static',filename='css/main.css')}}" rel="stylesheet" />

  <style>
    .form-input {
      padding: 10px;
      width: 500px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #3498db;
    }

    .pdf-container {
      margin-top: 20px;
      text-align: center;
    }

    .assessmentHeader {
      text-align: center;
      margin-top: 50px;
    }

    .upload-container {
      padding: 20px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }


    .referral-pdf {
      margin-top: 20px;
    }

    .overlay-text {
      text-align: center;
      margin-top: 20px;
    }

  </style>
</head>

<body>
  <header>{% include 'includes/navbar/navbar.html' %}</header>
  <h1 class="assessmentHeader">Assessment Form</h1>

<form class="upload-container" action="/upload-pdf" id="upload-pdf" method="post" enctype="multipart/form-data">
  <label class="audio-pdf" for="audio-file">Upload Audio PDF:</label>
  <input type="file" name="audio-file" id="audio-file" required class="upload-button" />

  <label class="referral-pdf" for="referral-file">Upload Referral Form PDF:</label>
  <input type="file" name="referral-file" id="referral-file" required class="upload-button" />
  
  <input class="submit-btn" type="submit" value="Upload" aria-busy="false" />
</form>



  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="overlay-container">
      <div class="overlay-spinner" id="spinner" role="status" aria-live="polite"></div>
      <div class="overlay-text">
      <p>Processing PDF...</p>
    </div>
    </div>
  </div>

  <div id="pdf-container" class="pdf-container" style="display: none">
    <iframe id="pdf-viewer"></iframe>
    <br />
    <a id="download-btn" class="download-btn" href="#" download="">Download PDF</a>
  </div>

  <script>
    const form = document.getElementById("upload-pdf");
    const submitBtn = document.getElementsByClassName("submit-btn")[0];
    const overlay = document.getElementById("overlay");

    const pdfContainer = document.getElementById("pdf-container");
    const pdfViewer = document.getElementById("pdf-viewer");
    const downloadBtn = document.getElementById("download-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault(); // Prevent default form submission

      submitBtn.value = "Submitting...";
      overlay.style.display = "block";
      overlay.setAttribute("aria-hidden", "false");
      submitBtn.setAttribute("aria-busy", "true");

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const errorText = await response.text();
          alert(`Submission failed: ${response.status} ${errorText}`);
          return;
        }

        const contentDisposition = response.headers.get(
          "Content-Disposition"
        );
        let filename;
        if (
          contentDisposition &&
          contentDisposition.indexOf("filename=") !== -1
        ) {
          const matches = /filename="(.+)"/.exec(contentDisposition);
          if (matches && matches[1]) {
            filename = matches[1];
          }
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        pdfViewer.src = url;
        form.style.display = "none";
        pdfContainer.style.display = "block";

        // Set the download button link and filename
        downloadBtn.href = url;
        downloadBtn.download = filename;

        alert("File processed and ready for viewing and download!");
        form.reset();
      } catch (error) {
        alert("An error occurred while submitting the form.");
      } finally {
        overlay.style.display = "none";
        submitBtn.classList.remove("disabled-button");
        submitBtn.value = "Upload";
        submitBtn.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>

</html>
