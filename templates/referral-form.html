<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MidStream Referral Form</title>
  <link href="{{url_for('static',filename='css/main.css')}}" rel="stylesheet" />
  <style>
    .ref-container {
      max-width: 1000px;
      margin: 5px auto;
      display: flex;
      flex-direction: column;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .progress-container {
      width: 100%;
      background-color: #f3f3f3;
      border-radius: 25px;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 20px;
      width: 0%;
      background-color: #4caf50;
      border-radius: 25px;
      text-align: center;
      line-height: 20px;
      color: white;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
    }

    .container {
      position: absolute;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .spinner {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 6px solid #673ab7;
      border-color: #673ab7 transparent #673ab7 transparent;
      animation: rotate 1.5s linear infinite;
    }

    @keyframes rotate {
      100% {
        transform: rotate(360deg);
      }
    }

    .pdf-container {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

  iframe {
    width: 100%;
    height: 700px;
    border: 1px solid #ccc;
    margin-bottom: 10px;
    border-radius: 1em;
  }

    .download-btn {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    label {
    display: block;
    margin-top: 10px;
    color: #555;
  }

  input[type="text"],
  input[type="email"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 15px;

    border-radius: 4px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  textarea {
    resize: vertical;
    height: 80px;
  }

  .prevBtn,
  .nextBtn {
    background-color: #3498db;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }

  .prevBtn:hover, .nextBtn:hover, .download-btn:hover {
    background-color: #4cae4c;
  }

  .refHeader {
    text-align: center;
    margin-bottom: 20px;
  }
  </style>
</head>

<body>
  <header>{% include 'includes/navbar/navbar.html' %}</header>

  <body>
    <section class="ref-container">
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <h1 class="refHeader">Referral Form</h1>
    {% include 'includes/forms/referral-form.html' %}

      <div id="overlay" class="overlay" aria-hidden="true">
        <div class="container">
          <div class="spinner" id="spinner" role="status" aria-live="polite"></div>
          <p>Processing Form...</p>
          <p>Do not refresh or close the page</p>
        </div>
      </div>

      <div id="pdf-container" class="pdf-container" style="display: none">
        <iframe id="pdf-viewer"></iframe>
        <br />
        <a id="download-btn" class="download-btn" href="#" download="">Download PDF</a>
      </div>
    </section>

    <script>
      const form = document.getElementById('referralForm');
      const submitBtn = document.getElementById('submitBtn');
      const overlay = document.getElementById("overlay");
      const pdfContainer = document.getElementById("pdf-container");
      const pdfViewer = document.getElementById("pdf-viewer");
      const downloadBtn = document.getElementById("download-btn");
      const totalSteps = 8;

      let currentStep = 1;

      window.onload = stepLoader = () => {
    updateProgressBar();
    const steps = document.querySelectorAll(".step");
    steps.forEach((step, index) => {
      if (index === 0) {
        step.style.display = "block";
      } else {
        step.style.display = "none";
      }
    });
  };

  const updateProgressBar = () => {
    const progressBar = document.getElementById("progressBar");
    const progressPercentage = (currentStep / totalSteps) * 100;
    progressBar.style.width = progressPercentage + "%";
    progressBar.innerText = Math.round(progressPercentage) + "%";
  };

  const nextStep = (step) => {
    document.getElementById(`step${step}`).style.display = "none";
    document.getElementById(`step${step + 1}`).style.display = "block";
    currentStep = step + 1;
    updateProgressBar();
  };

  const prevStep = (step) => {
    document.getElementById(`step${step}`).style.display = "none";
    document.getElementById(`step${step - 1}`).style.display = "block";
    currentStep = step - 1;
    updateProgressBar();
  };


      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        submitBtn.value = "Uploading...";
        overlay.style.display = "block";
        overlay.setAttribute("aria-hidden", "false");
        submitBtn.setAttribute("aria-busy", "true");
        lastStep = document.getElementById(`step8`);
        lastStep.style.display = 'none';

        const formData = {
          personalInformation: {
            header: document.getElementById('sectionOneHeader').textContent,
            "First Name": document.getElementById('clientFirstName').value,
            "Last Name": document.getElementById('clientLastName').value,
            "Title": document.getElementById('title').value,
            "Preferred Name": document.getElementById('preferredName').value,
            "Address": document.getElementById('address').value,
            "Contact Number": document.getElementById('contactNumber').value,
            "Email": document.getElementById('email').value,
            "Preferred Contact": document.getElementById('preferredContact').value,
            "D.O.B": document.getElementById('dob').value,
            "Gender": document.getElementById('gender').value,
            "Pronoun": document.getElementById('pronoun').value,
            "Residency": document.getElementById('residency').value,
            "Ethnicity": document.getElementById('ethnicity').value,
            "Iwi / Hapu (if Maori):": document.getElementById('iwi').value,
            "First Language (if not English)": document.getElementById('language').value,
            "Interpreter": document.getElementById('interpreter').value,
            "Cultural Support": document.getElementById('culturalSupport').value,
            "Communication Needs": document.getElementById('communicationNeeds').value,
          },
          medicalInformation: {
            header: document.getElementById('sectionTwoHeader').textContent,
            "Doctor": document.getElementById('doctor').value,
            "Medical Center": document.getElementById('medicalCentre').value,
            "Medical Contact": document.getElementById('medicalContact').value,
            "NHI": document.getElementById('nhi').value,
          },
          disabilityInformation: {
            header: document.getElementById('sectionThreeHeader').textContent,
            "Disability Name": document.getElementById('disabilityName').value,
            "Other Medical": document.getElementById('otherMedical').value,
            "Reason for Referral": document.getElementById('reasonForReferral').value,
            "Supports/Services Desired": document.getElementById('supportNeeds').value,
            "Urgency of Services": document.getElementById('urgencyOfServices').value,
          },
          additionalInformation: {
            header: document.getElementById('sectionFourHeader').textContent,
            "Safety Hazards, or Sensitive Issues": document.getElementById('safetyHazards').value,
            "Other Important Information": document.getElementById('otherImportantInformation').value,
          },
          referrersContact: {
            header: document.getElementById('sectionFiveHeader').textContent,
            "First Name": document.getElementById('altFirstName').value,
            "Last Name": document.getElementById('altLastName').value,
            "Contact Number": document.getElementById('altContactNumber').value,
            "Email": document.getElementById('altEmail').value,
            "Relationship to the Person Referred": document.getElementById('relationship').value,
          },
          emergencyContact: {
            header: document.getElementById('sectionSixHeader').textContent,
            "First Name": document.getElementById('referrerFirstName').value,
            "Last Name": document.getElementById('referrerLastName').value,
            "Contact Number": document.getElementById('referrerContactNumber').value,
            "Email": document.getElementById('referrerEmail').value,
            "Relationship to the Person Referred": document.getElementById('referrerRelationship').value,
          },
          consent: {
            header: document.getElementById('sectionSevenHeader').textContent,
            "Consent to Provide Information": document.getElementById('consent').value,
            "Consent to Share Information for Assessment": document.getElementById('shareInformation').value,
            "Consent to Be Contacted for Verification/Additional Information": document.getElementById('contactConsent').value,
            "Consent for Statistical Reporting": document.getElementById('consentStatReporting').value,
            "Right to Access/Correct Provided Information": document.getElementById('accessInformation').value,
          },
          signatory: {
            header: document.getElementById('sectionEightHeader').textContent,
            "Signature Method": document.getElementById('signature').value,
            "Name of Parent/Guardian (if on behalf of a child)": document.getElementById('parentName').value,
            "Date": document.getElementById('signDate').value,
          }

        }

        try {
          const response = await fetch(form.action, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData),
          });

          if (!response.ok) {
            const errorText = await response.text();
            alert(`Upload failed: ${response.status} ${errorText}`);
            return;
          };

          const contentDisposition = response.headers.get('Content-Disposition');
          let filename = 'default.pdf'; // Fallback filename
if (
    contentDisposition &&
    contentDisposition.indexOf("filename=") !== -1
) {
    const matches = /filename="?([^"]+)"?/.exec(contentDisposition);
    if (matches && matches[1]) {
        filename = matches[1].trim();
    }
}
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);

          pdfViewer.src = url;
          pdfContainer.style.display = "block";

          downloadBtn.href = url;
          downloadBtn.download = filename;

          alert("Form processed and ready for viewing and download!");
        } catch (error) {
          alert("An error occurred while uploading the form.");
        } finally {
          overlay.style.display = "none";
          submitBtn.classList.remove("disabled-button");
          submitBtn.value = "Submit Form";
          submitBtn.setAttribute("aria-busy", "false");
        }

      });


    </script>
  </body>

</html>
