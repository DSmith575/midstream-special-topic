<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MidStream Audio Processing</title>
  <link href="{{url_for('static',filename='css/main.css')}}" rel="stylesheet" />

  <style>
    .upload-container {
      padding: 20px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pdf-container {
      margin-top: 20px;
      text-align: center;
    }


    .audioHeader {
      text-align: center;
      margin-top: 50px;
    }

    .ffmpeg {
      text-align: center;
      margin-top: 10px;
    }

    .overlay-text {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <header>{% include 'includes/navbar/navbar.html' %}</header>

  <section>
    <h1 class="audioHeader">Upload Audio File</h1>
    <p class="ffmpeg" style="color: red">
      Ensure FFmpeg is installed. Please install it from
      <a href="https://ffmpeg.org/download.html">here</a>.
    </p>

    <form class="upload-container" action="/upload-audio" id="upload-audio" method="post" enctype="multipart/form-data">
      <input type="file" name="file" required class="upload-button" />
      <input class="submit-btn" type="submit" value="Upload" aria-busy="false" />
    </form>

    <div id="overlay" class="overlay" aria-hidden="true">
      <div class="overlay-container">
        <div class="overlay-spinner" id="spinner" role="status" aria-live="polite"></div>
        <div class="overlay-text">
          <p>Processing audio...</p>
          <p>Do not refresh or close the page</p>
        </div>
      </div>
    </div>

    <div id="pdf-container" class="pdf-container" style="display: none">
      <iframe id="pdf-viewer"></iframe>
      <br />
      <a id="download-btn" class="download-btn" href="#" download="">Download PDF</a>
    </div>
  </section>

  <script>
    const form = document.getElementById("upload-audio");
    const submitBtn = document.getElementsByClassName("submit-btn")[0];
    const overlay = document.getElementById("overlay");
    const pdfContainer = document.getElementById("pdf-container");
    const pdfViewer = document.getElementById("pdf-viewer");
    const downloadBtn = document.getElementById("download-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      submitBtn.value = "Uploading...";
      overlay.style.display = "block";
      form.style.display = "none";
      overlay.setAttribute("aria-hidden", "false");
      submitBtn.setAttribute("aria-busy", "true");

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          // Handle non-200 responses
          const errorText = await response.text();
          alert(`Upload failed: ${response.status} ${errorText}`);
          return;
        }

        const contentDisposition = response.headers.get(
          "Content-Disposition"
        );
        let filename;
        if (
          contentDisposition &&
          contentDisposition.indexOf("filename=") !== -1
        ) {
          const matches = /filename="(.+)"/.exec(contentDisposition);
          if (matches && matches[1]) {
            filename = matches[1];
          }
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        // Display the PDF in an iframe
        pdfViewer.src = url;
        pdfContainer.style.display = "block";

        // Set the download button link and filename
        downloadBtn.href = url;
        downloadBtn.download = filename;

        alert("File processed and ready for viewing and download!");
      } catch (error) {
        alert("An error occurred while uploading the file.");
      } finally {
        overlay.style.display = "none";
        submitBtn.classList.remove("disabled-button");
        submitBtn.value = "Upload";
        submitBtn.setAttribute("aria-busy", "false");
      }
    });

  </script>
</body>

</html>
